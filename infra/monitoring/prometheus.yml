global:
  scrape_interval: 10s

scrape_configs:
  - job_name: 'auth-service'
    static_configs:
      - targets: ['auth-service:3001']
  - job_name: 'citizen-service'
    static_configs:
      - targets: ['citizen-service:3002']
  - job_name: 'complaint-service'
    static_configs:
      - targets: ['complaint-service:3003']
  - job_name: 'notification-service'
    static_configs:
      - targets: ['notification-service:3004']
  - job_name: 'monitoring-service'
    static_configs:
      - targets: ['monitoring-service:3005']
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
  - job_name: 'blackbox'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
        - http://auth-service:3001/health
        - http://citizen-service:3002/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
